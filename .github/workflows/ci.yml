name: Native checks
on:
  push:
  pull_request:
  # This dispatch path is intentionally protected by the repository environment.
  # Ordinary pull requests never receive Apple Development or release credentials.
  workflow_dispatch:
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  credential-free-validation:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Fast validation
        run: ./scripts/validate fast
      - name: Tests (headless foundation and native adapters)
        run: ./scripts/validate test
      - name: Accessibility smoke test (ad-hoc signed, isolated data)
        run: ./scripts/validate ui
      - name: Thread Sanitizer
        run: ./scripts/validate tsan
      - name: Release and packaging
        run: ./scripts/validate package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: validation-logs
          path: |
            .build-*/Logs/Test
            .build-validation

  first-party-analysis:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: First-party analysis (blocking)
        run: ./scripts/validate analysis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: first-party-analysis
          path: |
            .build-analysis-first-party/*.log
            .build-analysis-first-party/*.plist
            .build-analysis-first-party/*.json
            .build-validation
  quickjs-audit:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build-analysis-quickjs/validated.json
          key: quickjs-audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Vendor/QuickJS/**', 'Sources/JortJavaScript/**', 'scripts/analyze.py', 'docs/quickjs-analyzer-*.json') }}
      - name: QuickJS dependency audit (informational; review diagnostic changes)
        run: ./scripts/validate quickjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: quickjs-audit
          path: |
            .build-analysis-quickjs/*
            .build-validation

  signed-integration:
    # Repository administrators must bind this job to a protected environment
    # that supplies only disposable Apple Development fixture credentials. It
    # never accepts Developer ID or notarization credentials.
    if: github.event_name == 'workflow_dispatch' && github.ref_protected
    runs-on: [self-hosted, macOS, jort-signed-integration]
    environment: signed-integration
    steps:
      - uses: actions/checkout@v4
      - name: Explain protected integration prerequisites
        env:
          JORT_APPLE_DEVELOPMENT_IDENTITY: ${{ vars.JORT_APPLE_DEVELOPMENT_IDENTITY }}
          JORT_DEVELOPMENT_TEAM_ID: ${{ vars.JORT_DEVELOPMENT_TEAM_ID }}
          JORT_DEVELOPMENT_PROVISIONING_PROFILE: ${{ vars.JORT_DEVELOPMENT_PROVISIONING_PROFILE }}
        run: |
          test -n "${JORT_APPLE_DEVELOPMENT_IDENTITY:-}" || { echo "JORT_APPLE_DEVELOPMENT_IDENTITY must be configured in the protected environment" >&2; exit 1; }
          test -n "${JORT_DEVELOPMENT_TEAM_ID:-}" || { echo "JORT_DEVELOPMENT_TEAM_ID must be configured in the protected environment" >&2; exit 1; }
          test -n "${JORT_DEVELOPMENT_PROVISIONING_PROFILE:-}" || { echo "JORT_DEVELOPMENT_PROVISIONING_PROFILE must select an installed development provisioning profile" >&2; exit 1; }
      - name: Signed helper identity and entitlement integration
        env:
          JORT_APPLE_DEVELOPMENT_IDENTITY: ${{ vars.JORT_APPLE_DEVELOPMENT_IDENTITY }}
          JORT_DEVELOPMENT_TEAM_ID: ${{ vars.JORT_DEVELOPMENT_TEAM_ID }}
          JORT_DEVELOPMENT_PROVISIONING_PROFILE: ${{ vars.JORT_DEVELOPMENT_PROVISIONING_PROFILE }}
        run: ./scripts/validate signed-integration
