name: Native checks
on: [push, pull_request]
env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Report toolchain
        run: xcodebuild -version && xcrun swift --version
      - name: Check Swift formatting
        run: python3 scripts/format.py --check
      - name: Check deterministic project
        run: python3 scripts/check-project.py
      - name: Tests (headless foundation and native adapters)
        run: ./scripts/test.sh
      - name: Accessibility smoke test (ad-hoc signed, isolated data)
        run: ./scripts/test-ui.sh
      - name: Thread Sanitizer
        run: |
          xcodebuild -project Jort.xcodeproj -scheme JortFoundation -configuration Debug -derivedDataPath .build-tsan -destination 'platform=macOS' -enableThreadSanitizer YES test
          xcodebuild -project Jort.xcodeproj -scheme JortNativeTests -configuration Debug -derivedDataPath .build-native-tsan -destination 'platform=macOS' -enableThreadSanitizer YES test
      - name: Release and packaging
        run: ./scripts/build.sh && python3 scripts/test-packaging.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: validation-logs
          path: |
            .build-*/Logs/Test

  first-party-analysis:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: First-party analysis (blocking)
        run: python3 scripts/analyze.py first-party
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: first-party-analysis
          path: |
            .build-analysis-first-party/*.log
            .build-analysis-first-party/*.plist
            .build-analysis-first-party/*.json
  quickjs-audit:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build-analysis-quickjs/validated.json
          key: quickjs-audit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Vendor/QuickJS/**', 'Sources/JortJavaScript/**', 'scripts/analyze.py', 'docs/quickjs-analyzer-*.json') }}
      - name: QuickJS dependency audit (informational; review diagnostic changes)
        run: python3 scripts/analyze.py quickjs --reuse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          include-hidden-files: true
          name: quickjs-audit
          path: .build-analysis-quickjs/*
