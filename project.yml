name: Jort
options:
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    MARKETING_VERSION: 0.3.0
    CURRENT_PROJECT_VERSION: 3
    ARCHS: '$(ARCHS_STANDARD)'
targets:
  JortSettings:
    type: framework
    platform: macOS
    sources: [Sources/JortSettings]
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.settings
  JortDocument:
    type: framework
    platform: macOS
    sources: [Sources/JortDocument]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.document
  JortPersistence:
    type: framework
    platform: macOS
    sources: [Sources/JortPersistence]
    dependencies:
      - target: JortDocument
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.persistence
  JortAppKit:
    type: framework
    platform: macOS
    sources: [Sources/JortAppKit]
    dependencies:
      - target: JortDocument
      - target: JortPersistence
      - target: JortSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.appkit
  Jort:
    type: application
    platform: macOS
    sources:
      - path: Jort/JortApp.swift
      - path: Jort/Resources
        excludes:
          - IconSources/jort-black.svg
          - IconSources/jort-color.png
          - IconSources/jort-j-stitch-black.svg
          - IconSources/jort-j-stitch-white.svg
    preBuildScripts:
      - name: Generate application icon
        script: 'bash "$SRCROOT/scripts/generate-icon.sh"'
        inputFiles:
          - $(SRCROOT)/Jort/Resources/IconSources/jort-color.png
          - $(SRCROOT)/scripts/generate-icon.sh
        outputFiles:
          - $(SRCROOT)/Jort/Resources/AppIcon.icns
    info:
      path: Jort/Info.plist
      properties:
        CFBundleIconFile: AppIcon.icns
        CFBundleDisplayName: Jort
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.editor
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: JortDocument
        embed: true
      - target: JortPersistence
        embed: true
      - target: JortAppKit
        embed: true
      - target: JortSettings
        embed: true
  StoreLockProbe:
    type: tool
    platform: macOS
    sources: [Tools/StoreLockProbe]
    dependencies:
      - target: JortDocument
      - target: JortPersistence
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: '@executable_path'
  JortFoundationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/Foundation
      - path: Tests/Settings
      - path: Tests/Support
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: JortDocument
      - target: JortPersistence
      - target: JortSettings
      - target: StoreLockProbe
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.foundationtests
  JortCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppKit
      - path: Tests/Support
      - path: Tests/Fixtures/canvas-10000.txt
        buildPhase: resources
    dependencies:
      - target: JortDocument
      - target: JortPersistence
      - target: JortAppKit
      - target: JortSettings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.editortests
  JortUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UI]
    dependencies:
      - target: Jort
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jort.uitests
schemes:
  JortNativeTests:
    build:
      targets:
        JortAppKit: all
    test:
      environmentVariables:
        JORT_PERFORMANCE_ENFORCE: $(JORT_PERFORMANCE_ENFORCE)
      targets: [JortCoreTests]
  JortAdapters:
    build:
      targets:
        JortAppKit: all
  JortFoundation:
    build:
      targets:
        JortSettings: all
        JortDocument: all
        JortPersistence: all
        StoreLockProbe: all
    test:
      environmentVariables:
        JORT_PERFORMANCE_ENFORCE: $(JORT_PERFORMANCE_ENFORCE)
      targets: [JortFoundationTests]
  Jort:
    build:
      targets:
        Jort: all
    test:
      environmentVariables:
        JORT_PERFORMANCE_ENFORCE: $(JORT_PERFORMANCE_ENFORCE)
      targets: [JortFoundationTests, JortCoreTests, JortUITests]
